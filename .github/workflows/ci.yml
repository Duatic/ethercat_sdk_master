name: CI
on:
  workflow_dispatch:
    inputs:
      ros_distro:
        description: 'Distro to build'
        type: choice
        options: [all, humble, jazzy, kilted, lyrical, rolling]
        default: all
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]
  schedule:
    - cron: '30 0 * * *'
      timezone: "Europe/Zurich"

jobs:
  ci:
    permissions:
      contents: write
      packages: write
    uses: Duatic/ci-workflows/.github/workflows/ci_orchestrator.yml@v2
    with:
      ros_distro: ${{ inputs.ros_distro }}
      gated: ${{ github.event_name != 'schedule' }}
      extra_distros: humble
      devtools_ref: v1
    secrets: inherit
